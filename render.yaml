# Render "Blueprint": creates the database, the API and the website in one go.
databases:
  - name: devteam-db
    plan: free
    databaseName: dev_team

services:
  - type: web
    name: devteam-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devteam-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # you type this in during setup
      - key: ACCESS_CODE
        generateValue: true  # Render invents a random code; read it from the dashboard
      - key: CORS_ORIGINS
        sync: false          # the website's address (filled in after the first deploy)
      - key: MAX_FIX_ATTEMPTS
        value: "3"

  - type: web
    name: devteam-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false          # the API's address (filled in after the first deploy)
